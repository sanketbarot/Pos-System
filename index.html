<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crust & Chilly - Premium POS System</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Dynamic Toast Container for floating messages -->
  <div id="toast-container" class="toast-container"></div>

  <!-- AUTHENTICATION OVERLAY LAYER (Loads first if not logged in) -->
  <div id="auth-view" class="auth-container">
    <div class="auth-card view-animate">
      <div class="auth-header">
        <div class="auth-brand-logo">
          <i class="fa-solid fa-fire-flame-curved"></i>
        </div>
        <h1 style="font-size: 24px; font-weight: 800; margin-bottom: 6px;">Crust & Chilly</h1>
        <p style="color: var(--text-muted); font-size: 13px;">Enter credentials to access POS Terminal</p>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-username">Username</label>
          <input type="text" id="login-username" class="form-input" placeholder="e.g., admin or staff" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="Password (hint: 123)" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-3" style="padding: 12px;">
          <i class="fa-solid fa-right-to-bracket"></i> Authenticate
        </button>
      </form>
      <div style="margin-top: 20px; font-size: 11px; color: var(--text-muted); text-align: center;">
        Admin ID: <strong>admin</strong> | Staff ID: <strong>staff</strong> (Password: <strong>123</strong>)
      </div>
    </div>
  </div>

  <!-- MAIN SYSTEM LAYOUT CONTAINER -->
  <div id="app-container" style="display: none;">
    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">
      <div class="brand-section">
        <div class="brand-logo">
          <i class="fa-solid fa-fire-flame-curved"></i>
        </div>
        <span class="brand-title">CRUST & CHILLY</span>
      </div>

      <nav style="flex-grow: 1; display: flex; flex-direction: column;">
        <ul class="nav-menu">
          <li class="nav-item active" data-view="dashboard">
            <a href="#dashboard"><i class="fa-solid fa-chart-pie"></i>Dashboard</a>
          </li>
          <li class="nav-item" data-view="pos">
            <a href="#pos"><i class="fa-solid fa-receipt"></i>POS Terminal</a>
          </li>
          <li class="nav-item" data-view="orders">
            <a href="#orders"><i class="fa-solid fa-kitchen-set"></i>KDS Kitchen</a>
          </li>
          <li class="nav-item" data-view="menu">
            <a href="#menu"><i class="fa-solid fa-burger"></i>Menu Setup</a>
          </li>
          <li class="nav-item" data-view="reports">
            <a href="#reports"><i class="fa-solid fa-file-invoice-dollar"></i>Analytics</a>
          </li>
        </ul>
      </nav>

      <!-- USER INFO BAR FOOTER -->
      <div class="user-profile-section">
        <div class="user-info">
          <div class="user-avatar" id="header-avatar-letter">A</div>
          <div class="user-details">
            <span class="user-name" id="header-username">Sanket Barot</span>
            <span class="user-role" id="header-role">Admin</span>
          </div>
        </div>
        <button class="btn-logout" id="logout-button" title="Log Out Session">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </aside>

    <!-- RIGHT CONTAINER WRAPPER -->
    <main class="main-workspace">
      <!-- TOP NAVIGATION BAR -->
      <header class="top-header">
        <div class="header-title-area">
          <h2 id="current-view-title">Dashboard</h2>
        </div>
        <div class="header-actions">
          <div class="date-time-widget" id="header-date-time">
            Loading Date & Time...
          </div>
        </div>
      </header>

      <!-- DYNAMIC CONTENT VIEW VIEWPORT -->
      <section class="view-viewport view-animate" id="view-viewport">
        <!-- Rendered view files mount here dynamically -->
      </section>
    </main>
  </div>

  <!-- POPUP DIALOG MODAL LAYOUT -->
  <div id="modal-container" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Dialog Title</h3>
        <button class="modal-close" id="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Form elements or customized bill mock here -->
      </div>
      <div class="modal-footer" id="modal-footer">
        <button class="btn btn-secondary" id="modal-cancel-btn">Cancel</button>
        <button class="btn btn-primary" id="modal-submit-btn">Save</button>
      </div>
    </div>
  </div>

  <!-- Javascript Modules CDN Dependencies & Scripts -->
  <!-- ChartJS CDN for premium graphs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- App JS & DB files -->
  <script src="js/db.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/pos.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/reports.js"></script>
  <script src="app.js"></script>
</body>
</html>
